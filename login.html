<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Bait - Login</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Background -->
    <div class="app-root">
        <div class="animated-bg"></div>
        <div class="bg-overlay-pattern"></div>
        <div class="bg-vignette"></div>

        <!-- Content Wrapper -->
        <div class="content-layer">
            
            <!-- Header -->
            <div class="header-wrapper">
                <button id="header-settings-btn" class="header-btn" aria-label="Settings" onclick="toggleSettings()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
</button>
            </div>

            <!-- Main Container -->
            <div class="main-view">
                <!-- Login View -->
                <div id="login-view" class="auth-view">
                    <button id="login-back-btn" class="auth-back-btn">
                        <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                        Back
                    </button>
                    <div class="auth-card">
                        <h2 class="auth-title">Login</h2>
                        <form id="login-form">
                            <div class="auth-input-group">
                                <label class="auth-label">Email</label>
                                <input type="email" id="login-email" class="auth-input" placeholder="fisher@masterbait.com" required>
                            </div>
                            <div class="auth-input-group">
                                <label class="auth-label">Password</label>
                                <input type="password" id="login-password" class="auth-input" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="auth-submit-btn">Enter World</button>
                        </form>
                        <div class="auth-footer">
                            Don't have an account? <span id="go-to-signup" class="auth-link">Sign Up</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div class="overlay" id="settings-overlay">
    <div class="settings-modal">
        <div class="settings-header">
            <div class="settings-title-group">
                <svg class="settings-gear-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <h2>SETTINGS</h2>
            </div>

            <button class="settings-close-x" onclick="toggleSettings()" aria-label="Close settings">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="settings-body">
            <div class="settings-row">
                <span>Master Volume</span>
                <input
                    type="range"
                    id="volume-slider"
                    class="settings-slider"
                    min="0"
                    max="100"
                    value="50"
                    oninput="updateVolume()"
                >
            </div>

            <div class="settings-row">
                <span>Music</span>
                <label class="settings-switch">
                    <input type="checkbox" id="music-toggle" onchange="toggleMusic()" checked>
                    <span class="settings-slider-toggle"></span>
                </label>
            </div>
        </div>

        <div class="settings-footer">
            <button class="settings-close-btn" onclick="toggleSettings()">CLOSE MENU</button>
        </div>
    </div>
</div>

    <audio id="bgMusic" loop preload="auto">
  <source src="./audio/capstoneMenu.mp3" type="audio/mpeg">
</audio>

    <script src="./settings.js"></script>
    <script src="./menuMusic.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
