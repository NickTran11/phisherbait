<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phisher Bait - Game Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Background -->
    <div class="app-root">
        <div class="animated-bg"></div>
        <div class="bg-overlay-pattern"></div>
        <div class="bg-vignette"></div>

        <!-- Content Wrapper -->
        <div class="content-layer">
            
            <!-- Header -->
            <div class="header-wrapper">
                <button id="header-settings-btn" class="header-btn" aria-label="Settings" onclick="toggleSettings()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
</button>
            </div>

            <!-- Main Container -->
            <div class="main-view">
                
                <!-- Landing View -->
                <div id="landing-view" class="landing-container">
                    <div style="width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; min-height: 600px;">
                        
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 32px; width: 100%; max-width: 896px; padding: 0 16px;">
                            <!-- Game Title -->
                            <div style="width: 100%; display: flex; justify-content: center; transform: scale(1); transition: transform 0.3s;">
                                <div class="game-title-container">
                                    <div class="game-title-scaler">
                                        <div class="swing-wrapper">
                                            <!-- Fishing Line -->
                                            <div class="fishing-line"></div>
                                            <!-- Hook Group -->
                                            <div class="hook-group">
                                                <div class="hook-svg-wrapper">
                                                    <svg viewBox="0 0 50 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                                                        <defs>
                                                            <linearGradient id="hookMetal" x1="0" y1="0" x2="1" y2="1">
                                                                <stop offset="0%" stop-color="#d1d5db" />
                                                                <stop offset="40%" stop-color="#f9fafb" />
                                                                <stop offset="60%" stop-color="#9ca3af" />
                                                                <stop offset="100%" stop-color="#4b5563" />
                                                            </linearGradient>
                                                        </defs>
                                                        <circle cx="25" cy="6" r="4.5" stroke="url(#hookMetal)" stroke-width="3" />
                                                        <path d="M 25 10 L 25 75 C 25 98, 5 98, 5 75 L 5 60" stroke="url(#hookMetal)" stroke-width="3.5" stroke-linecap="round" fill="none" />
                                                        <path d="M 5 60 L 11 68" stroke="url(#hookMetal)" stroke-width="3" stroke-linecap="round" />
                                                    </svg>
                                                </div>
                                            </div>
                                            <!-- Envelope -->
                                            <div class="envelope-wrapper">
                                                <div class="envelope">
                                                    <div class="envelope-pattern"></div>
                                                    <div style="position: absolute; top: 16px; left: 16px; width: 64px; height: 4px; background-color: rgba(153, 27, 27, 0.2); transform: rotate(-2deg);"></div>
                                                    <div style="position: absolute; bottom: 16px; left: 16px; width: 96px; height: 96px; border-left: 4px solid rgba(156, 163, 175, 0.1); border-bottom: 4px solid rgba(156, 163, 175, 0.1); border-bottom-left-radius: 24px;"></div>
                                                    <div style="position: relative; z-index: 10; display: flex; align-items: center; gap: 16px; transform: rotate(-2deg);">
                                                        <span class="title-text-master">PHISHER</span>
                                                        <span class="title-text-bait">BAIT</span>
                                                    </div>
                                                    <div class="stamp">Confidential</div>
                                                    <div style="position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background-color: rgba(0,0,0,0.6); border-radius: 50%; filter: blur(1px);"></div>
                                                    <div style="position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(107, 114, 128, 0.5);"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Main Action Area -->
                            <div style="width: 100%; max-width: 190px; display: flex; flex-direction: column; gap: 12px; margin-top: 80px;">
                                <!-- Start Button -->
                                <div style="width: 100%; z-index: 10;">
                                    <button id="start-btn" class="btn-start">
                                        <span style="position: relative; z-index: 10; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1)); display: flex; align-items: center; gap: 8px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">
                                            Start Game
                                            <svg style="width: 16px; height: 16px; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                                            </svg>
                                        </span>
                                        <div style="position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent); pointer-events: none;"></div>
                                    </button>
                                  <button onclick="window.location.href='contacts.html'">
  Contacts
</button>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Version Footer -->
                    <div class="footer">
                        • BACH TRAN (NICK TRAN) • ADAM REID • <br/>
                        • CONGRUI XU (TONY) • CHUXIAN ZHENG (JIMMY) •
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div class="overlay" id="settings-overlay">
    <div class="settings-modal">
        <div class="settings-header">
            <div class="settings-title-group">
                <svg class="settings-gear-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <h2>SETTINGS</h2>
            </div>

            <button class="settings-close-x" onclick="toggleSettings()" aria-label="Close settings">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="settings-body">
            <div class="settings-row">
                <span>Master Volume</span>
                <input
                    type="range"
                    id="volume-slider"
                    class="settings-slider"
                    min="0"
                    max="100"
                    value="50"
                    oninput="updateVolume()"
                >
            </div>

            <div class="settings-row">
                <span>Music</span>
                <label class="settings-switch">
                    <input type="checkbox" id="music-toggle" onchange="toggleMusic()" checked>
                    <span class="settings-slider-toggle"></span>
                </label>
            </div>

            <div class="settings-divider"></div>

            <button id="settings-logout-btn" class="settings-logout-btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                LOGOUT
            </button>
        </div>

        <div class="settings-footer">
            <button class="settings-close-btn" onclick="toggleSettings()">CLOSE MENU</button>
        </div>
    </div>
</div>

    <audio id="bgMusic" loop preload="auto">
  <source src="./audio/capstoneMenu.mp3" type="audio/mpeg">
</audio>

    <script src="./settings.js"></script>
    <script src="./menuMusic.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
